schema_version: 1
feature_name: generic-release-packaging-workflow
core_value: Maintainers can manually build, verify, and stage reproducible Linux release packages for an annotated XMMS GTK4 Experimental tag.
summary: >-
  Port the proven multi-distribution release-packaging workflow from the sibling
  xmms-gtk2 repository under a generic workflow name. The fork needs a
  reviewable GitHub Actions path that validates the selected release tag,
  builds source and Debian packages for its declared targets, verifies the
  resulting artifacts, and creates or resumes a draft GitHub Release without
  publishing it.
in_scope:
  - id: e04
    item: A manually dispatched, generically named release-packaging workflow that accepts a SemVer version and only operates on its matching annotated tag.
  - id: e04
    item: Linux Mint 22.3 and Ubuntu 26.04 package matrix ported from the donor, with fork branding and the GTK3 development prerequisite required by the migration proof.
  - id: e04
    item: Artifact metadata, checksums, package installation smoke tests, and draft-release assembly protected by least-privilege GitHub token permissions.
  - id: e04
    item: Static repository tests and release documentation synchronized with the ported workflow contract.
out_of_scope:
  - item: Push or pull-request CI.
    reason: The requested donor workflow is a manual release-packaging pipeline, not continuous integration.
  - item: Dependabot, issue templates, and pull-request templates from the donor repository.
    reason: The user requested only the release-packaging workflow.
  - item: Automatic publication, tag creation, or modification of an existing published release.
    reason: Publication remains an explicit maintainer decision and immutable releases must not be replaced.
  - item: New package targets, changed Debian recipes, or a migration away from Autotools.
    reason: The port must retain the donor target matrix and consume the existing packaging contract.
constraints:
  - Keep the workflow filename distro-neutral because it builds more than one distribution.
  - Preserve the fork's xmms runtime package names while using XMMS GTK4 Experimental branding in release metadata.
  - Restrict default workflow permissions to contents read; grant contents write only to the draft-release job.
  - Pin third-party GitHub Actions to the donor's reviewed commit SHAs.
  - Require libgtk-3-dev in the workflow build dependencies so the enabled GTK3 proof is exercised.
success_criteria:
  - .github/workflows/package-release.yml is manually dispatchable with a required SemVer version input.
  - The workflow rejects a ref that is not the matching annotated vVERSION tag and validates release metadata before packaging.
  - Both donor Linux targets build, inspect, install, and checksum xmms and libxmms-dev DEBs using the fork's existing package tooling.
  - The workflow creates or resumes only a draft release and never silently publishes or overwrites a published release.
  - Repository tests and release documentation assert the generic workflow filename, fork branding, GTK3 dependency, and release safety contract.
prior_art:
  - candidate: ../xmms-gtk2/.github/workflows/package-linux-mint.yml
    verdict: adopt-and-adapt
    notes: Proven manually dispatched Linux Mint 22.3 plus Ubuntu 26.04 package matrix, checksum, package smoke-test, and draft-release flow; rename and adapt branding/dependencies for this fork.
  - candidate: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
    verdict: adopt
    notes: GitHub documents workflow_dispatch inputs and the permissions key; use minimum GITHUB_TOKEN privilege by job.
references:
  - docs/releases.md
  - docs/architecture/build-and-test.md
  - tools/build-deb.sh
  - packaging/debian/rules
  - specs/adr/ADR-0001-staged-gtk-migration.md
