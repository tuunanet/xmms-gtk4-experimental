schema_version: 1
status: scoped
initiative: direct-gtk4-x11-migration
core_value: Keep the classic XMMS desktop experience maintainable on a supported toolkit without breaking its plugin and playback contracts.
summary: >-
  Migrate XMMS Classic directly from GTK2/GDK2 to GTK 4.22 on an Ubuntu 26.04
  baseline. The final application remains explicitly X11-only so it can retain
  the classic skinned multi-window model, including shaped windows, absolute
  positioning, docking, shading, and double-size behavior.

  The initiative is a multi-pull-request migration epic. It removes every
  active GTK2 dependency from the core, reusable UI helpers, bundled plugins,
  build system, tests, packages, CI, and release artifacts. Every plugin-family
  programming interface remains frozen. GTK-dependent plugins are ported and
  recompiled rather than loaded as historical GTK2 binaries.
in_scope:
  - story_id: e02s01
    outcome: Freeze executable plugin compatibility contracts and prove GTK4/X11 native shaping, positioning, drawing, and input feasibility before production migration.
  - story_id: e02s02
    outcome: Add isolated GTK2 and GTK4 build modes and establish Cairo-based classic skin rendering with pixel-golden coverage.
  - story_id: e02s03
    outcome: Run the classic main player transport, displays, menus, events, heartbeat, and remote-control behavior through a GTK4 X11 window.
  - story_id: e02s04
    outcome: Manage the complete playlist workflow through its GTK4 X11 window without changing the playlist model, locks, formats, or socket behavior.
  - story_id: e02s05
    outcome: Port the equalizer and deliver exact shape, movement, docking, grouping, shading, and double-size behavior through the contained X11 adapter.
  - story_id: e02s06
    outcome: Port preferences, asynchronous file and directory selection, remaining core dialogs, and GTK-facing libxmms helpers to GTK4.
  - story_id: e02s07
    outcome: Port every bundled Input and Output plugin UI to GTK4 while preserving interfaces, audio behavior, and optional backends.
  - story_id: e02s08
    outcome: Port every bundled Effect and General plugin UI to GTK4 while preserving interfaces, transforms, sessions, and external-control behavior.
  - story_id: e02s09
    outcome: Port every bundled visualization plugin to GTK4/X11 while preserving VisPlugin lifecycle, data shapes, timing, settings, and identifiers.
  - story_id: e02s10
    outcome: Remove GTK2 and temporary migration scaffolding and ship a GTK4-only Ubuntu 26.04 build, package, documentation set, and release gate.
out_of_scope:
  - item: Wayland support or compositor-neutral window management.
    reason: Exact classic positioning, docking, shaping, and multi-window behavior is prioritized and requires the X11 backend.
  - item: An intermediate GTK3 build or release.
    reason: The approved migration path is a direct GTK2-to-GTK4 effort.
  - item: Loading precompiled GTK2-linked plugin binaries.
    reason: Complete GTK2 removal is incompatible with loading those binaries; plugin sources may be ported and recompiled against the frozen XMMS interface.
  - item: Redesigning the skin, window model, controls, menus, or established interactions.
    reason: This is a toolkit migration, not a product redesign.
  - item: Retiring bundled plugins or optional legacy backends.
    reason: Plugin retirement requires separate compatibility review and approval.
  - item: Changing plugin structs, exported plugin entry points, callback data, or lifecycle semantics.
    reason: Third-party source compatibility is a non-negotiable public contract.
  - item: Breaking GTK-independent libxmms APIs, control-socket commands, configuration paths, keys, or skin formats.
    reason: These interfaces are independent of the toolkit migration and remain stable.
  - item: Unrelated playback, decoder, output, network, codec, or Autotools replacement work.
    reason: Broad modernization would increase migration risk without contributing to GTK2 removal.
constraints:
  technical:
    - Require GTK 4.22 or newer and retain GLib, POSIX threads, GNU Autotools, libtool, Linux, and X11.
    - Require the GTK X11 backend and preserve direct X11 integration where GTK4 intentionally omits window-manager controls.
    - Preserve all InputPlugin, OutputPlugin, EffectPlugin, GeneralPlugin, and VisPlugin binary layouts and source contracts.
    - Preserve exported get_*plugin_info symbols, injected plugin fields, render data shapes, and callback ordering.
    - Preserve WinAmp 2 and XMMS skin assets, masks, dimensions, hit testing, configuration, and observable behavior.
    - Preserve GTK-independent libxmms APIs; document necessary source migrations for GTK-facing helpers.
    - Port all currently bundled optional plugin UIs and visualization plugins.
    - Keep GTK operations on the main thread and preserve existing audio, socket, visualization, and playlist lock boundaries.
    - Do not mix GTK2 and GTK4 in one process.
    - Permit temporary separate GTK2 and GTK4 build configurations only until the final cutover removes GTK2 and migration scaffolding.
  delivery:
    - Deliver as one epic composed of independently reviewed pull requests.
    - Keep the GTK2 release build green while each separate GTK4 migration slice gains coverage, then remove the GTK2 mode at final cutover.
    - Keep applicable build and verification gates green at every merge boundary.
    - Start with compatibility tests and an X11 feasibility proof before committing to the full cutover shape.
    - Evaluate changed and new paths against CI classification, release workflows, packaging manifests, source distribution, and ignore rules.
    - Use Ubuntu 26.04 as the authoritative build, package, and CI baseline.
success_criteria:
  - A clean Ubuntu 26.04 environment configures and builds XMMS with GTK 4.22 or newer and no GTK2 development package.
  - Source and generated build inputs contain no active GTK2 or GDK2 include, flag, package, or compatibility dependency.
  - Dynamic dependency checks find no GTK2 or GDK2 SONAME in XMMS executables or bundled shared objects.
  - Compile-time and runtime ABI tests prove all plugin-family structures, entry points, callbacks, and injected fields remain compatible.
  - Existing bundled plugins are rebuilt, discovered, configured, enabled, disabled, and cleaned up through their unchanged interfaces.
  - Existing skins render with preserved dimensions, masks, colors, control hit regions, and double-size behavior.
  - X11 tests or recorded UAT prove shaping, positioning, docking, shading, popup behavior, keyboard and pointer input, and drag-and-drop.
  - Playback, playlist, remote control, visualization timing, configuration persistence, and plugin loading remain behaviorally unchanged.
  - make lint, the complete Xvfb test suite, distcheck, Debian package build, package install, and smoke tests pass on the new baseline.
  - Contributor, architecture, build, packaging, and migration documentation describe GTK4 requirements and third-party plugin recompilation.
