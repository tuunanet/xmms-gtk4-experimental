schema_version: 1
status: scoped
initiative: project-local-dual-review
core_value: Give XMMS Classic changes two independent, repository-aware Pi reviews before pull-request delivery.
summary: >-
  Add trusted project-local reviewer definitions and a repeatable dual-review entry point for the existing bigpowers request-review gate. Reviewers will run in isolated local Pi sessions, receive identical self-contained briefs, and return independent findings before either report influences remediation.

  This is development infrastructure only. It does not change XMMS runtime behavior, build dependencies, installed package contents, or public compatibility contracts.
in_scope:
  - story_id: e02s01
    outcome: Declare a pinned project-local subagent package that supports two parallel isolated Pi review sessions.
  - story_id: e02s01
    outcome: Provide two repository-controlled reviewer roles with the same read-and-verify rubric and no edit or write tools.
  - story_id: e02s01
    outcome: Provide one documented project prompt that constructs the dual-blind AND gate required by request-review.
  - story_id: e02s01
    outcome: Keep automatically installed project package contents out of version control.
  - story_id: e02s01
    outcome: Run the static wiring contract through make check and include the inspectable reviewer configuration in source distributions.
  - story_id: e02s01
    outcome: Verify package discovery, reviewer discovery, isolation, independent reports, and unchanged repository contents.
  - story_id: e02s01
    outcome: Update project instructions to record that project-local external-agent wiring is enabled.
out_of_scope:
  - item: Run reviewers automatically in GitHub Actions.
    reason: Deferred because project reviewers require model credentials and explicit trust approval; live CI remains focused on deterministic build and test gates.
  - item: Give reviewer agents edit or write tools.
    reason: Excluded to preserve separation between review and remediation.
  - item: Replace human pull-request review or branch protection.
    reason: Excluded because local agent review is an additional quality gate, not repository authorization.
  - item: Require different model providers for Reviewer A and Reviewer B.
    reason: Deferred because context isolation is required, while provider diversity depends on each maintainer's authenticated model catalog.
  - item: Add general-purpose implementation, planning, or recursive delegation agents.
    reason: Excluded to keep the trusted project prompt surface limited to the approved dual-review use case.
constraints:
  technical:
    - Pin the reviewed subagent package version in project settings.
    - Preserve interactive confirmation for repository-controlled project agents.
    - Keep child working directories inside the trusted workspace.
    - Do not commit package caches, credentials, sessions, generated dependencies, or model output.
    - Reviewer definitions may inspect files and run verification commands but must not edit repository content.
    - Evaluate every new .pi path against workflow classification, packaging manifests, release automation, and ignore rules.
  delivery:
    - Deliver through a separate pull request against protected main using the team-pr workflow.
    - Require end-to-end manual acceptance before enabling the wiring for the pending keyboard-shortcuts review.
success_criteria:
  - Pi discovers the pinned project package and both project-local reviewer definitions from a clean checkout.
  - One invocation starts Reviewer A and Reviewer B concurrently with identical task briefs and isolated contexts.
  - Each reviewer returns an independent categorized report, verification result, score, and PASS or FAIL verdict.
  - Interactive use requires explicit approval before repository-controlled reviewers execute.
  - A dual-review smoke test leaves tracked and untracked repository state unchanged except for pre-existing build artifacts.
  - The normal XMMS build and xvfb-backed test suite remain green.
references:
  - CLAUDE.md
  - CONVENTIONS.md
  - specs/product/VISION_LATEST.yaml
  - specs/tech-architecture/tech-stack.md
  - docs/architecture/build-and-test.md
  - /home/tuunanet/.pi/agent/npm/node_modules/bigpowers/.pi/skills/request-review/SKILL.md
  - /home/tuunanet/.nvm/versions/node/v26.4.0/lib/node_modules/@earendil-works/pi-coding-agent/docs/packages.md
  - /home/tuunanet/.nvm/versions/node/v26.4.0/lib/node_modules/@earendil-works/pi-coding-agent/docs/prompt-templates.md
research:
  title: Prior Art
  candidates:
    - name: Official Pi subagent example
      source: /home/tuunanet/.nvm/versions/node/v26.4.0/lib/node_modules/@earendil-works/pi-coding-agent/examples/extensions/subagent
      verdict: reject-vendoring
      fit: Supports project-agent discovery, isolated child processes, parallel execution, confirmation, cancellation, and usage reporting.
      risks:
        - Vendoring the example would add approximately 1140 lines of extension code for a configuration task.
        - Copied code would drift from the installed Pi runtime.
    - name: "@aprimediet/minion@2.3.1"
      source: https://www.npmjs.com/package/@aprimediet/minion
      verdict: reject
      fit: Supports project overrides and parallel child processes with a small package surface.
      risks:
        - Inspected event reduction uses a JSON event field that differs from the current official Pi example, creating compatibility uncertainty.
    - name: "@bacnh85/pi-subagent@0.12.2"
      source: https://www.npmjs.com/package/@bacnh85/pi-subagent
      verdict: adopt
      fit: Provides isolated in-process Pi SDK sessions, parallel execution, project-agent discovery, trusted confirmation, bounded timeouts, workspace containment, tool validation, and parent-model fallback.
      slopcheck: "[SUS] User-approved on 2026-07-29. Published peer metadata supports @earendil-works/pi-* >=0.80.0 <0.83.0 and installed Pi is 0.82.1; README contains a stale narrower compatibility sentence, so end-to-end verification is mandatory."
      risks:
        - Pi extensions execute with full local access and therefore require source review, version pinning, and explicit project trust.
        - Parallel reviewers multiply model usage.
        - Package documentation and metadata must be checked together until the stale compatibility sentence is corrected upstream.
  decision:
    outcome: Adopt the pinned pi-subagent package and configure only the two approved project reviewer roles.
    rationale:
      - It provides stronger trust-boundary controls than the official example while avoiding a large vendored extension.
      - Its published peer range covers the installed Pi version.
      - Project settings install the exact pinned version after trust approval, making setup reproducible for maintainers.
