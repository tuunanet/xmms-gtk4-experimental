schema_version: 1
feature_name: gtk3-main-window-slice
core_value: >-
  Future toolkit migration work gains a testable GTK3 main-window tracer that
  preserves classic XMMS geometry and transport behavior without putting the
  production GTK2 player or its compatibility contracts at risk.
summary: >-
  Extend the existing Play-button GTK3 proof into the next bounded migration
  initiative: a separately linked GTK3 main-window shell. The shell gives
  maintainers executable evidence for the classic main-window frame, display
  surface, and a small transport-control path while the shipped player remains
  GTK2.

  The initiative is a migration tracer, not a production toolkit switch or a
  second full player. It focuses on deterministic rendering and activation
  evidence that can be run under Xvfb and checked for GTK-major linkage
  isolation. Existing plugin, socket, configuration, skin, package, and
  executable contracts remain unchanged.
in_scope:
  - id: e07s01
    item: >-
      Render a GTK3 main-window shell with the classic dimensions, skin-frame
      geometry, and deterministic display fixtures.
  - id: e07s02
    item: >-
      Exercise a GTK3 transport-control slice through the established
      toolkit-neutral boundary, covering state presentation and valid or
      invalid activation without starting playback.
  - id: e07s03
    item: >-
      Make the GTK3 main-window tracer reproducible in Meson tests and source
      distribution checks, with explicit GTK2/GTK3 linkage isolation and
      architecture documentation.
out_of_scope:
  - item: >-
      Switching the production xmms process from GTK2 to GTK3 or GTK4.
    reason: >-
      The staged migration requires more behavior slices and an explicit
      production-switch approval after the tracer proves sufficient coverage.
  - item: >-
      Porting the playlist, equalizer, preferences, skin browser, or dock
      windows.
    reason: >-
      These are separate UI surfaces with distinct state and interaction
      contracts; including them would make this tracer non-vertical and too
      broad.
  - item: >-
      Starting audio playback, loading plugins, reading user configuration, or
      opening the control socket from the GTK3 process.
    reason: >-
      Mixed GTK-major plugin linkage and production-core coupling are explicit
      risks that this initiative must continue to avoid.
  - item: GTK4 compilation or runtime support.
    reason: >-
      GTK3 remains the accepted bridge and must be exercised before a GTK4
      slice is planned.
  - item: >-
      Changes to plugin ABI, libxmms APIs, control-socket commands, skin file
      format, installed executable names, or package contracts.
    reason: >-
      These are preservation contracts and are not required to prove the
      next UI migration boundary.
constraints:
  - Keep the GTK3 tracer in a separately linked executable; never mix GTK2 and
    GTK3 in one process or plugin-loading path.
  - Use existing GLib, GTK3, Cairo, GdkPixbuf, Meson, Xvfb, and C tooling only;
    do not add external dependencies.
  - Keep GTK operations on the main thread and keep test fixtures deterministic
    and in memory where practical.
  - Preserve production GTK2 behavior and all plugin, socket, configuration,
    skin, source-distribution, and Debian packaging contracts.
  - Do not reformat or refactor historical GTK2 modules unless a later story
    explicitly scopes the change.
success_criteria:
  - A GTK3 tracer renders the approved main-window shell geometry and fixture
    states with repeatable assertions under Xvfb.
  - The tracer exercises the approved transport-control boundary and rejects
    invalid activation without invoking playback or plugin code.
  - Automated linkage checks prove the tracer links GTK3 and not GTK2 while
    the production target retains its GTK2 dependency.
  - Meson test, strict preflight, and source-distribution checks include the
    tracer without changing the production delivery artifacts.
  - Architecture documentation records the new boundary, its limitations, and
    the conditions for a future production toolkit decision.
