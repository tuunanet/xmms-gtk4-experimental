schema_version: 1
status: scoped
initiative: gtk4-experimental-identity
core_value: Establish XMMS GTK4 Experimental as a distinct fork with a clean 0.0.1 release baseline without breaking inherited runtime compatibility contracts.
summary: >-
  Replace the inherited project branding and repository links with XMMS GTK4 Experimental, while moving prior fork-specific release narrative into the historical documentation area. Reset the project release version to 0.0.1 so future work starts from a clearly independent version line.

  Runtime compatibility identifiers remain stable: executable, Debian binary package, libxmms API, plugin ABI, control protocol, and user configuration paths continue to use their inherited xmms names.
in_scope:
  - story_id: e02s01
    outcome: Current documentation, packaging descriptions, project metadata, and repository links consistently identify XMMS GTK4 Experimental.
  - story_id: e02s01
    outcome: Prior fork-specific release narrative is retained only under docs/history.
  - story_id: e02s01
    outcome: Authoritative and shipped Autotools version metadata reports 0.0.1.
  - story_id: e02s01
    outcome: Package and release contract tests reflect the new identity and version baseline.
out_of_scope:
  - item: Rename the xmms executable, Debian binary package, libxmms library/API, plugin ABI, socket protocol, or ~/.xmms paths.
    reason: These are compatibility-sensitive runtime contracts and the requested project rebrand does not require breaking them.
  - item: Complete the GTK4 migration.
    reason: This change establishes identity and versioning only; toolkit migration is planned separately.
  - item: Rewrite original upstream XMMS history files.
    reason: Archived source material must remain historically accurate.
constraints:
  technical:
    - Update authoritative Autotools inputs and their checked-in generated counterparts together.
    - Preserve inherited runtime and plugin compatibility identifiers.
    - Keep references to the inherited fork identity only in docs/history.
    - Evaluate new history paths against distribution manifests, release tooling, ignore rules, and CI classification.
  delivery:
    - Deliver through a pull request from a feature branch.
    - Keep the discovered baseline fix in a separate Conventional Commit.
success_criteria:
  - No mention of the inherited fork identity or its former repository slug remains outside docs/history.
  - Current repository URLs use tuunanet/xmms-gtk4-experimental.
  - Configure reports package version 0.0.1.
  - Runtime compatibility identifiers remain unchanged.
  - Build, package, release, test, and distribution gates pass.
references:
  - CLAUDE.md
  - CONVENTIONS.md
  - specs/IMPACT_LATEST.md
  - specs/bugs/BUG-2026-07-29T111455-stale-keyboard-shortcut-test.md
  - specs/tech-architecture/tech-stack.md
  - docs/architecture/build-and-test.md
