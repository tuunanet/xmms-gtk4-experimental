prior_art:
  observed_context:
    - 121 C and header files use GTK or GDK symbols; 59 are under xmms and 50 are distributed across bundled plugin families and libxmms.
    - The custom skin stack uses GdkPixmap in 45 files, GdkGC in 41 files, legacy widget signals in 48 files, and direct widget window access in 28 files.
    - Existing UI coverage is limited to entry, file-browser, font, popup-position, and partial plugin-loader tests.
    - The repository's earlier GTK1-to-GTK2 history required multiple compatibility follow-ups, demonstrating that compile success alone did not preserve behavior.
    - The opensrc CLI is installed but does not provide its documented search subcommand, so no cached GTK source was available.
    - The Ubuntu 26.04 host supplies GTK 4.22.2 packages, but libgtk-4-dev is not yet installed locally.
  candidates:
    - name: GtkDrawingArea with Cairo surfaces
      source: https://docs.gtk.org/gtk4/class.DrawingArea.html
      verdict: adopt
      fit: GTK4 provides a Cairo draw callback and queued redraw model suitable for preserving fixed-coordinate skin compositing after GdkPixmap and GdkGC removal.
      risks:
        - Pixel output, mask scaling, clipping, and redraw invalidation require golden tests.
    - name: GTK4 event controllers and gestures
      source: https://docs.gtk.org/gtk4/migrating-3to4.html#stop-using-gtkwidget-event-signals
      verdict: adopt
      fit: GtkGestureClick, GtkEventControllerMotion, GtkEventControllerKey, and GtkEventControllerScroll are the supported replacements for legacy widget event signals.
      risks:
        - Gesture claiming and propagation differ from raw GTK2 event dispatch and may change custom hit testing without contract tests.
    - name: GMainContext and GTK4 application lifecycle
      source: https://docs.gtk.org/gtk4/migrating-3to4.html#stop-using-gtk_main-and-related-apis
      verdict: adopt
      fit: GTK4 removes gtk_main and directs applications to GApplication or GMainContext APIs; either can retain the main-thread heartbeat and socket queue processing.
      risks:
        - Shutdown, plugin cleanup, and nested event-pumping behavior must be made explicit before replacement.
    - name: GtkFileDialog
      source: https://docs.gtk.org/gtk4/class.FileDialog.html
      verdict: adopt
      fit: GTK 4.22 provides asynchronous open, save, multiple-file, and folder-selection operations for replacing GtkFileSelection and directory browser UI.
      risks:
        - Existing synchronous callback assumptions require state and lifetime redesign at GTK-facing boundaries.
    - name: GDK X11 surface access plus Xlib/XShape
      source: https://docs.gtk.org/gdk4-x11/class.X11Surface.html
      verdict: extend-with-contained-adapter
      fit: Exact X11 positioning and shaping require a narrow backend adapter around native XIDs, Xlib, EWMH, and XShape because GTK4 intentionally removes backend-neutral move, restack, and shape controls.
      risks:
        - gdk_x11_surface_get_xid and several GDK X11 helpers are deprecated since GTK 4.18 without a supported replacement for these requirements.
        - The adapter is intentionally backend-specific and must fail clearly when GDK_BACKEND is not X11.
    - name: Preserve the existing custom widget hit-test model
      source: xmms/widget.c
      verdict: extend
      fit: The classic controls are already toolkit-light data structures with fixed geometry and callbacks; adapting their draw and event boundaries avoids redesigning the skin or plugin core.
      risks:
        - Current structs store GdkPixmap and GdkGC directly, so ownership and rendering surfaces must be separated first.
    - name: GTK3 intermediate migration
      source: https://docs.gtk.org/gtk4/migrating-3to4.html
      verdict: reject-by-decision
      fit: GTK recommends preparing on GTK 3.24, but the approved scope explicitly requires a direct GTK2-to-GTK4 migration.
      risks:
        - Rejecting the intermediate stage increases cutover size and makes feasibility and compatibility harnesses mandatory.
  decision:
    outcome: Compose supported GTK4 drawing, event, dialog, and main-loop APIs with a narrowly isolated X11 native-window adapter and preserved XMMS custom-widget and plugin contracts.
    rationale:
      - No maintained drop-in compatibility layer satisfies exact classic X11 behavior and complete GTK2 removal.
      - Most playback and plugin contracts are already separated from concrete GTK types.
      - A contained X11 adapter makes the deliberate backend restriction visible and testable.
      - Compatibility-first preparation and a feasibility spike reduce risk before the coordinated GTK4 cutover.
      - Temporary separate build modes keep main releasable and expose every migration slice to normal CI before GTK2 is removed.
