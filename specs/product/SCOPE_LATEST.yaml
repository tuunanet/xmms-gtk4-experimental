schema_version: 1
feature_name: modern-gnome-c-foundations
core_value: >-
  Future GTK migration work has a small, testable GNOME C foundation that keeps
  new APIs private by default and preserves XMMS's established compatibility
  contracts.
summary: >-
  Establish the modern C conventions needed for future GTK3/GTK4 migration
  slices without converting the production GTK2 player. The initiative defines
  final-type and public-API boundaries, constrains new subsystem dependencies,
  and applies formatting checks to changed GNOME C files.

  The work applies these rules first to the isolated GTK3 migration proof. It
  must preserve the historic plugin ABI, libxmms API, control socket,
  configuration, skins, and the separate-process GTK-major boundary.
in_scope:
  - id: e06s01
    item: Define final GObject, private-instance-data, minimal-public-header,
      property/signal, extension-interface, and mutable-state boundaries, then
      prove them in the isolated GTK3 migration module.
  - id: e06s02
    item: Define and enforce directional dependencies for new GNOME C modules.
  - id: e06s03
    item: Add changed-file GNOME C formatting checks to the developer preflight.
out_of_scope:
  - item: Production GTK3 or GTK4 player port.
    reason: The isolated proof remains a migration tracer until a separately
      approved UI slice changes the production toolkit.
  - item: Plugin ABI, libxmms API, or control-socket conversion to GObject.
    reason: These are explicit compatibility facades, not approved extension
      boundaries for this initiative.
  - item: Bulk conversion of existing GTK2-era structs or historical modules.
    reason: Modernization-by-style would expand risk without a caller-visible
      migration benefit.
  - item: New external dependencies.
    reason: GLib and the optional GTK3 proof dependency already supply the
      required GObject facilities.
constraints:
  - Preserve the separately linked GTK3 proof and prohibit mixed GTK major
    versions in the production process.
  - Keep GTK work on the main thread and use Xvfb for GTK tests.
  - Keep new instance data private, do not add process-global mutable state,
    and expose properties, signals, or interfaces only for genuine observable
    or extension boundaries.
  - Preserve all plugin, socket, configuration, skin, source-distribution, and
    package contracts.
success_criteria:
  - A documented and regression-tested policy defines the approved GObject and
    public-API boundaries with explicit legacy compatibility exemptions.
  - The isolated GTK3 migration module demonstrates a final type with private
    state and no unnecessary property, signal, or interface.
  - Directional dependencies and changed-file formatting have focused,
    repeatable checks.
  - Strict preflight remains green without new dependencies or runtime
    compatibility changes.
references:
  - specs/product/VISION_LATEST.yaml
  - specs/adr/ADR-0001-staged-gtk-migration.md
  - docs/architecture/ui-interaction.md
  - docs/architecture/build-and-test.md
  - specs/epics/e06-modern-gnome-c-foundations/epic.yaml
