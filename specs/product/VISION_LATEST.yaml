schema_version: 1
status: active
project: xmms-gtk4-experimental
vision: Evolve the classic XMMS experience in a new GTK4-focused experimental fork while preserving compatibility deliberately where it remains valuable.
principles:
  - Give the fork an independent product identity and pre-1.0 release line.
  - Plan compatibility breaks explicitly rather than introducing them accidentally.
  - Keep historical provenance in dedicated history documentation.
  - Require regression evidence for behavior changes.
