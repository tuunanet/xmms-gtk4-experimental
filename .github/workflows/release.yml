name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$RELEASE_TAG")" != tag ]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point to a commit contained in main." >&2
            exit 1
          fi
          tools/check-release-version.sh "$version"
          mkdir release-artifacts
          tools/extract-release-notes.sh \
            "$version" release-artifacts/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            gettext \
            libasound2-dev \
            libgtk2.0-dev \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Configure
        run: ./configure --disable-esd

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: xvfb-run --auto-servernum make check

      - name: Verify source distribution
        run: xvfb-run --auto-servernum make distcheck

      - name: Prepare release artifacts
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          archive="xmms-$RELEASE_VERSION.tar.gz"
          test -f "$archive"
          cp "$archive" release-artifacts/
          (
            cd release-artifacts
            sha256sum "$archive" > SHA256SUMS
          )

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  create-draft-release:
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-artifacts

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          archive="release-artifacts/xmms-$RELEASE_VERSION.tar.gz"
          checksums=release-artifacts/SHA256SUMS
          notes=release-artifacts/release-notes.md
          test -f "$archive"
          test -f "$checksums"
          test -s "$notes"

          if gh release view "$RELEASE_TAG" --json isDraft \
              --jq .isDraft > release-is-draft 2>/dev/null; then
            if [ "$(cat release-is-draft)" != true ]; then
              echo "Refusing to modify the published release $RELEASE_TAG." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              "$archive" "$checksums" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "XMMS GTK2 $RELEASE_VERSION" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              "$archive" "$checksums" \
              --draft \
              --verify-tag \
              --title "XMMS GTK2 $RELEASE_VERSION" \
              --notes-file "$notes"
          fi
