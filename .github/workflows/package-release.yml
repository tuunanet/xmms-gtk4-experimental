name: Package release

on:
  pull_request:
    paths:
      - ".github/workflows/package-release.yml"
      - "packaging/**"
      - "tests/test-package-recipes.sh"
  workflow_dispatch:
    inputs:
      version:
        description: "Draft SemVer release to package before publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.event_name }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Draft releases and their assets are only visible to tokens with write
      # access; keep broader permissions out of the package build jobs.
      contents: write
    outputs:
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      source_sha256: ${{ steps.release.outputs.source_sha256 }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out packaging recipes
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select and validate release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          version=$REQUESTED_VERSION
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version=$(sed -n \
              's/^AM_INIT_AUTOMAKE(\[xmms\], \[\([^]]*\)\])$/\1/p' \
              configure.in)
            tools/check-release-version.sh "$version"
            tag="v$version-pr"
            source_date_epoch=$(git show -s --format=%ct HEAD)
            mkdir source-release
            git archive --format=tar --prefix="xmms-$version/" HEAD | \
              gzip -n > "source-release/xmms-$version.tar.gz"
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "Package publication must run from main." >&2
              exit 1
            fi
            if ! printf '%s\n' "$version" | grep -Eq \
                '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "Version must be MAJOR.MINOR.PATCH SemVer." >&2
              exit 1
            fi

            tag="v$version"
            git fetch --force origin \
              "refs/heads/main:refs/remotes/origin/main" \
              "refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "$tag")" != tag ]; then
              echo "$tag must be an annotated tag." >&2
              exit 1
            fi
            tag_commit=$(git rev-list -n 1 "$tag")
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "$tag must point to a commit contained in main." >&2
              exit 1
            fi

            release=$(gh release view "$tag" \
              --json isDraft,isPrerelease,tagName)
            if [ "$(printf '%s' "$release" | jq -r .isDraft)" != true ] || \
               [ "$(printf '%s' "$release" | jq -r .isPrerelease)" != false ]; then
              echo "$tag must be an unpublished draft release." >&2
              exit 1
            fi

            mkdir source-release
            gh release download "$tag" --dir source-release \
              --pattern "xmms-$version.tar.gz" --pattern SHA256SUMS
            (
              cd source-release
              grep -Fx "$(grep "  xmms-$version.tar.gz$" SHA256SUMS)" \
                SHA256SUMS >/dev/null
              sha256sum -c SHA256SUMS
            )
            source_date_epoch=$(git for-each-ref \
              --format='%(taggerdate:unix)' "refs/tags/$tag")
          fi

          source_sha256=$(sha256sum \
            "source-release/xmms-$version.tar.gz" | cut -d' ' -f1)
          test -n "$source_date_epoch"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$source_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified release source
        uses: actions/upload-artifact@v7
        with:
          name: package-source-${{ steps.release.outputs.tag }}
          path: source-release/xmms-${{ steps.release.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build-deb:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.validate-release.outputs.source_date_epoch }}

    steps:
      - name: Check out packaging recipes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified release source
        uses: actions/download-artifact@v8
        with:
          name: package-source-${{ env.RELEASE_TAG }}
          path: source-release

      - name: Install Debian package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            gettext \
            libasound2-dev \
            libgl-dev \
            libgtk2.0-dev \
            libmikmod-dev \
            libsm-dev \
            libvorbis-dev \
            libxxf86vm-dev \
            lintian \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Build Debian packages
        run: |
          set -eu
          build_root=$PWD/deb-build
          mkdir "$build_root"
          tar -xzf "source-release/xmms-$RELEASE_VERSION.tar.gz" \
            -C "$build_root"
          source_dir="$build_root/xmms-$RELEASE_VERSION"
          rm -rf "$source_dir/packaging" "$source_dir/debian"
          cp -a packaging "$source_dir/packaging"
          cp -a packaging/debian "$source_dir/debian"
          release_date=$(date --date="@$SOURCE_DATE_EPOCH" --rfc-email)
          cat > "$source_dir/debian/changelog" <<EOF
          xmms (1:$RELEASE_VERSION-1~ubuntu24.04) noble; urgency=medium

            * Package XMMS Classic $RELEASE_VERSION.

           -- XMMS Classic contributors <47913151+tuunanet@users.noreply.github.com>  $release_date
          EOF
          (
            cd "$source_dir"
            dpkg-buildpackage --build=binary --no-sign
          )
          mkdir deb-artifacts
          cp "$build_root"/*.deb deb-artifacts/

      - name: Verify and install Debian packages
        run: |
          set -eu
          test "$(find deb-artifacts -name '*.deb' -type f | wc -l)" -eq 2
          runtime=$(realpath "$(find deb-artifacts -name 'xmms_*.deb' -type f)")
          devel=$(realpath \
            "$(find deb-artifacts -name 'libxmms-dev_*.deb' -type f)")
          test "$(dpkg-deb --field "$runtime" Package)" = xmms
          test "$(dpkg-deb --field "$devel" Package)" = libxmms-dev
          test "$(dpkg-deb --field "$runtime" Version)" = \
            "1:$RELEASE_VERSION-1~ubuntu24.04"
          test "$(dpkg-deb --field "$runtime" Architecture)" = amd64
          dpkg-deb --contents "$runtime" | grep -F './usr/bin/xmms'
          dpkg-deb --contents "$runtime" | grep -F '/libALSA.so'
          dpkg-deb --contents "$runtime" | grep -F \
            './usr/share/applications/xmms.desktop'
          dpkg-deb --contents "$devel" | grep -F \
            './usr/include/xmms/plugin.h'
          lintian --fail-on error deb-artifacts/*.deb
          sudo apt-get install -y "$runtime" "$devel"
          readelf -d /usr/lib/x86_64-linux-gnu/xmms/Input/libmpg123.so | \
            grep -F 'libm.so'
          if ldd -r /usr/lib/x86_64-linux-gnu/xmms/Input/libmpg123.so \
              2>&1 | grep 'undefined symbol: .*_ZGV'; then
            exit 1
          fi
          xvfb-run --auto-servernum xmms --version | grep -Fx \
            "xmms $RELEASE_VERSION"

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: deb-packages-${{ env.RELEASE_TAG }}
          path: deb-artifacts/*.deb
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build-rpm:
    needs: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: fedora:42
    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.validate-release.outputs.source_date_epoch }}

    steps:
      - name: Install workflow prerequisites
        run: dnf install -y findutils git gzip tar

      - name: Check out packaging recipes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified release source
        uses: actions/download-artifact@v8
        with:
          name: package-source-${{ env.RELEASE_TAG }}
          path: source-release

      - name: Install RPM package dependencies
        run: |
          dnf install -y \
            alsa-lib-devel \
            chrpath \
            desktop-file-utils \
            gcc \
            gettext \
            gtk2-devel \
            libglvnd-devel \
            libmikmod-devel \
            libSM-devel \
            libvorbis-devel \
            libXxf86vm-devel \
            make \
            pkgconf-pkg-config \
            rpm-build \
            xorg-x11-server-Xvfb \
            zlib-ng-compat-devel

      - name: Build RPM packages
        run: |
          set -eu
          rpmdev=$HOME/rpmbuild
          mkdir -p "$rpmdev"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "source-release/xmms-$RELEASE_VERSION.tar.gz" "$rpmdev/SOURCES/"
          cp packaging/xmms.desktop "$rpmdev/SOURCES/"
          sed "s/@VERSION@/$RELEASE_VERSION/g" \
            packaging/rpm/xmms.spec.in > "$rpmdev/SPECS/xmms.spec"
          rpmbuild -ba "$rpmdev/SPECS/xmms.spec"
          mkdir rpm-artifacts
          find "$rpmdev/RPMS" -type f -name '*.rpm' \
            ! -name '*debuginfo*' ! -name '*debugsource*' \
            -exec cp {} rpm-artifacts/ \;

      - name: Verify and install RPM packages
        run: |
          set -eu
          test "$(find rpm-artifacts -name '*.rpm' -type f | wc -l)" -eq 2
          runtime=$(find rpm-artifacts -name 'xmms-[0-9]*.x86_64.rpm' -type f)
          devel=$(find rpm-artifacts -name 'xmms-devel-*.x86_64.rpm' -type f)
          test "$(rpm -qp --qf '%{NAME}' "$runtime")" = xmms
          test "$(rpm -qp --qf '%{NAME}' "$devel")" = xmms-devel
          test "$(rpm -qp --qf '%{VERSION}' "$runtime")" = "$RELEASE_VERSION"
          test "$(rpm -qp --qf '%{ARCH}' "$runtime")" = x86_64
          rpm -qlp "$runtime" | grep -Fx /usr/bin/xmms
          rpm -qlp "$runtime" | grep -F /libALSA.so
          rpm -qlp "$runtime" | grep -Fx \
            /usr/share/applications/xmms.desktop
          rpm -qlp "$devel" | grep -Fx /usr/include/xmms/plugin.h
          dnf install -y "$runtime" "$devel"
          readelf -d /usr/lib64/xmms/Input/libmpg123.so | grep -F 'libm.so'
          if ldd -r /usr/lib64/xmms/Input/libmpg123.so 2>&1 | \
              grep 'undefined symbol: .*_ZGV'; then
            exit 1
          fi
          xvfb-run -a xmms --version | grep -Fx "xmms $RELEASE_VERSION"

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: rpm-packages-${{ env.RELEASE_TAG }}
          path: rpm-artifacts/*.rpm
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  attach-packages:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-release, build-deb, build-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}
      SOURCE_SHA256: ${{ needs.validate-release.outputs.source_sha256 }}

    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v8
        with:
          name: deb-packages-${{ env.RELEASE_TAG }}
          path: release-packages

      - name: Download RPM packages
        uses: actions/download-artifact@v8
        with:
          name: rpm-packages-${{ env.RELEASE_TAG }}
          path: release-packages

      - name: Prepare package metadata
        run: |
          set -eu
          test "$(find release-packages -name '*.deb' -type f | wc -l)" -eq 2
          test "$(find release-packages -name '*.rpm' -type f | wc -l)" -eq 2
          for asset in release-packages/*.deb; do
            safe_name=$(basename "$asset" | tr '~' '.')
            if [ "$asset" != "release-packages/$safe_name" ]; then
              mv "$asset" "release-packages/$safe_name"
            fi
          done
          (
            cd release-packages
            sha256sum ./*.deb ./*.rpm | sort -k2 > PACKAGES-SHA256SUMS
          )
          cat > release-packages/PACKAGE-METADATA.txt <<EOF
          XMMS Classic: $RELEASE_VERSION
          Source tag: $RELEASE_TAG
          Source archive SHA-256: $SOURCE_SHA256
          Packaging recipe commit: $GITHUB_SHA
          Package workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Debian target: Ubuntu 24.04 LTS (amd64)
          RPM target: Fedora 42 (x86_64)
          EOF

      - name: Attach packages to draft release
        run: |
          set -eu
          release=$(gh release view "$RELEASE_TAG" \
            --json assets,isDraft,isPrerelease)
          if [ "$(printf '%s' "$release" | jq -r .isDraft)" != true ] || \
             [ "$(printf '%s' "$release" | jq -r .isPrerelease)" != false ]; then
            echo "$RELEASE_TAG must be an unpublished draft release." >&2
            exit 1
          fi
          for asset in release-packages/*; do
            name=$(basename "$asset")
            if printf '%s' "$release" | jq -e --arg name "$name" \
                '.assets[] | select(.name == $name)' >/dev/null; then
              echo "Refusing to replace existing release asset $name." >&2
              exit 1
            fi
          done
          gh release upload "$RELEASE_TAG" release-packages/*
