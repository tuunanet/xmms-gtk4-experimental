name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from configure.in (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected release branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release branch and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            release/*) ;;
            *)
              echo "Release candidates must be built from a release/* branch." >&2
              exit 1
              ;;
          esac
          tools/check-release-version.sh "$EXPECTED_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            gettext \
            libasound2-dev \
            libgtk2.0-dev \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Configure
        run: ./configure --disable-esd

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: xvfb-run --auto-servernum make check

      - name: Verify source distribution
        run: xvfb-run --auto-servernum make distcheck

      - name: Prepare candidate artifacts
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.run_id }}
        run: |
          archive="xmms-$EXPECTED_VERSION.tar.gz"
          test -f "$archive"
          mkdir release-artifacts
          cp "$archive" release-artifacts/
          (
            cd release-artifacts
            sha256sum "$archive" > SHA256SUMS
          )
          cat > release-artifacts/RELEASE-METADATA.txt <<EOF
          Version: $EXPECTED_VERSION
          Commit: $SOURCE_SHA
          Workflow run: $WORKFLOW_RUN
          Status: release candidate; not an official release
          EOF

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmms-${{ inputs.version }}-candidate-${{ github.run_number }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30
