name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            gettext \
            libasound2-dev \
            libgl-dev \
            libgtk2.0-dev \
            libmikmod-dev \
            libsm-dev \
            libvorbis-dev \
            libxxf86vm-dev \
            lintian \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Configure
        run: ./configure --disable-esd

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: xvfb-run --auto-servernum make check

      - name: Verify source distribution
        run: xvfb-run --auto-servernum make distcheck

      - name: Build and verify Debian packages
        run: make deb
