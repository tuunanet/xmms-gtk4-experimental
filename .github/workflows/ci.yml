name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            gettext \
            libasound2-dev \
            libgtk2.0-dev \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Configure
        run: ./configure --disable-esd

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: xvfb-run --auto-servernum make check

      - name: Verify source distribution
        run: xvfb-run --auto-servernum make distcheck
