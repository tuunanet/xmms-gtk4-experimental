name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full-ci: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.source == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          # A path counts as "source" only if it matches every pattern (AND):
          # included by ** and not excluded by a ! rule below.
          predicate-quantifier: every
          # List matching files in the job log so skipped full CI is auditable.
          list-files: shell
          filters: |
            source:
              - '**'
              # Top-level prose / legal text (not compiled or packaged by make check).
              - '!README.md'
              - '!CHANGELOG.md'
              - '!CONTRIBUTING.md'
              - '!CONTRIBUTORS.md'
              - '!CODE_OF_CONDUCT.md'
              - '!SECURITY.md'
              - '!COPYING'
              - '!ABOUT-NLS'
              # Editor/VCS metadata that does not affect configure/build/tests.
              - '!.gitignore'
              - '!.gitattributes'
              - '!.editorconfig'
              # In-tree documentation.
              - '!docs/**'
              # GitHub human-facing templates (workflow YAML stays in "source").
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

      - name: Report classification
        if: github.event_name != 'workflow_dispatch'
        env:
          SOURCE_MATCH: ${{ steps.filter.outputs.source }}
          SOURCE_FILES: ${{ steps.filter.outputs.source_files }}
        run: |
          set -euo pipefail
          echo "source filter matched: ${SOURCE_MATCH}"
          if [ "${SOURCE_MATCH}" = "true" ]; then
            echo "Paths requiring full CI:"
            # paths-filter list-files: shell → space-separated; print one per line.
            # shellcheck disable=SC2086
            printf '%s\n' ${SOURCE_FILES}
            echo "full-ci will run."
          else
            echo "No build-affecting paths changed; full-ci will be skipped."
          fi

  full-ci:
    name: Full build and test
    needs: changes
    if: needs.changes.outputs.full-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            ccache \
            debhelper \
            devscripts \
            gettext \
            libasound2-dev \
            libgl-dev \
            libgtk2.0-dev \
            libmikmod-dev \
            libsm-dev \
            libvorbis-dev \
            libxxf86vm-dev \
            lintian \
            pkg-config \
            xvfb \
            zlib1g-dev

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          cache-namespace: ubuntu-24.04

      - name: Configure
        run: ./configure --disable-esd

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: xvfb-run --auto-servernum make check

      - name: Verify source distribution
        run: xvfb-run --auto-servernum make distcheck

      - name: Build and verify Debian packages
        run: make deb

      - name: Report compiler cache statistics
        run: ccache --show-stats

  build-and-test:
    name: build-and-test
    needs: [changes, full-ci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}

    steps:
      - name: Verify CI result
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          FULL_CI_REQUIRED: ${{ needs.changes.outputs.full-ci }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
        run: |
          set -euo pipefail

          if [ "${CLASSIFICATION_RESULT}" != success ]; then
            echo "Change classification did not succeed: ${CLASSIFICATION_RESULT}" >&2
            exit 1
          fi

          if [ "${FULL_CI_REQUIRED}" = true ]; then
            if [ "${FULL_CI_RESULT}" != success ]; then
              if [ "${FULL_CI_RESULT}" = cancelled ]; then
                echo "Full CI was cancelled (usually superseded by a newer push on this ref)." >&2
                echo "The latest commit's checks are authoritative for merge." >&2
              fi
              echo "Full CI did not succeed: ${FULL_CI_RESULT}" >&2
              exit 1
            fi
            echo "Full CI passed."
          else
            if [ "${FULL_CI_RESULT}" != skipped ]; then
              echo "Expected full CI to be skipped, got: ${FULL_CI_RESULT}" >&2
              exit 1
            fi
            echo "Docs/meta-only change; full CI was not required."
          fi
